<dialog id="{{ action }}-collection" class="action-dialog action-dialog--compact" aria-labelledby="{{ action }}-title">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="{{ action }}-title" class="h4 mb-0">{{ title }}</h2>
        <form method="dialog"><button class="btn-close" aria-label="Close"></button></form>
    </div>
    <form method="post" action="collections.php">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        {% if action == 'rename' %}<input type="hidden" name="collection_id" value="{{ selected.id }}">{% endif %}
        <label class="form-label" for="{{ action }}-name">Collection name</label>
        <input autofocus class="form-control mb-3" id="{{ action }}-name" name="name" required maxlength="150" value="{{ action == 'rename' ? selected.name : '' }}">
        <button class="btn btn-primary" name="action" value="{{ action }}">{{ action == 'create' ? 'Create collection' : 'Save changes' }}</button>
    </form>
</dialog>
