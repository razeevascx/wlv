<!doctype html>
<html lang="en">
<head>
    <base href="{{ app_base }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search games</title>
    <meta name="description" content="Search the videogame catalogue by title, release year, and rating.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" href="public/images/logo.svg" sizes="any">
    <script nonce="{{ csp_nonce }}" src="public/js/theme.js" blocking="render"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="public/css/theme.css" rel="stylesheet">
    <link rel="expect" href="#page-ready" blocking="render">
</head>
<body>
{% include 'components/navigation.html' %}
<main id="page-ready" class="container py-4">
    <h1>Search games</h1>
    <form class="row g-2 mb-4" method="get" action="search-games.php">
        <div class="col-md-4">
            <label class="visually-hidden" for="name">Game name</label>
            <input class="form-control" id="name" name="name" value="{{ name }}" placeholder="Game name">
        </div>
        <div class="col">
            <input class="form-control" type="number" name="from_year" value="{{ from_year }}" placeholder="From year">
        </div>
        <div class="col">
            <input class="form-control" type="number" name="to_year" value="{{ to_year }}" placeholder="To year">
        </div>
        <div class="col">
            <input class="form-control" type="number" name="min_rating" value="{{ min_rating }}" placeholder="Minimum rating" min="0" max="10">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>
    <p>{{ games|length }} result(s) found.</p>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead><tr><th>Name</th><th>Released</th><th>Rating</th></tr></thead>
            <tbody>
            {% for game in games %}
                <tr>
                    <td><a href="game-details.php?id={{ game.game_id }}">{{ game.game_name }}</a></td>
                    <td>{{ game.released_date }}</td>
                    <td>{{ game.rating }}/10</td>
                </tr>
            {% else %}
                <tr><td colspan="3">No games found.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</main>
{% include 'components/footer.html' %}
</body>
</html>
