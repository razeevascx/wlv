<!doctype html>
<html lang="en">
<head>
    <base href="{{ app_base }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit {{ game.game_name }} | Videogame catalogue</title>
    <meta name="description" content="Edit the release date, rating, and description for {{ game.game_name }} in your videogame catalogue.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" href="public/images/logo.svg" sizes="any">
    <script nonce="{{ csp_nonce }}" src="public/js/theme.js" blocking="render"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="public/css/theme.css" rel="stylesheet">
    <link rel="expect" href="#page-ready" blocking="render">
</head>
<body>
{% include 'components/navigation.html' %}
<main id="page-ready" class="container py-4">
    <a href="game-details.php?id={{ game.game_id }}">← Back</a>
    <h1 class="mt-4">Amend game</h1>
    <form action="update-game.php" method="post" style="max-width:40rem">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="id" value="{{ game.game_id }}">
        <label class="form-label" for="GameName">Game name</label>
        <input required maxlength="150" class="form-control mb-3" id="GameName" name="GameName" value="{{ game.game_name }}">
        <label class="form-label" for="GameDescription">Description</label>
        <textarea required maxlength="5000" class="form-control mb-3" id="GameDescription" name="GameDescription" rows="5">{{ game.game_description }}</textarea>
        <label class="form-label" for="DateReleased">Date released</label>
        <input required type="date" class="form-control mb-3" id="DateReleased" name="DateReleased" value="{{ game.released_date }}">
        <label class="form-label" for="GameRating">Rating (0-10)</label>
        <input required min="0" max="10" type="number" class="form-control mb-3" id="GameRating" name="GameRating" value="{{ game.rating }}">
        <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
</main>
{% include 'components/footer.html' %}
</body>
</html>
